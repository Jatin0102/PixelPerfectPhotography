<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Contact</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<header>

<h2>Contact Us</h2>

</header>

<div class="form-container">

<form th:action="@{/saveContact}" th:object="${contact}" method="post">

<input
type="text"
placeholder="Name"
th:field="*{name}"
required>

<input
type="email"
placeholder="Email"
th:field="*{email}"
required>

<input
type="text"
placeholder="Subject"
th:field="*{subject}"
required>

<textarea
placeholder="Message"
th:field="*{message}">
</textarea>

<button>

Send Message

</button>

</form>

</div>

</body>

</html>
