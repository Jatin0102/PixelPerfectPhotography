<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Event</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<header>

    <h2>Book Your Event</h2>

</header>

<div class="form-container">

<form th:action="@{/saveBooking}"
      th:object="${booking}"
      method="post">

    <!-- Customer Name -->

    <input
            type="text"
            placeholder="Customer Name"
            th:field="*{customer.customerName}"
            pattern="[A-Za-z ]{3,50}"
            title="Name should contain only letters and spaces."
            required>

    <!-- Email -->

    <input
            type="email"
            placeholder="Email"
            th:field="*{customer.email}"
            required>

    <!-- Mobile Number -->

    <input
            type="tel"
            placeholder="Mobile Number"
            th:field="*{customer.mobileNumber}"
            pattern="[6-9][0-9]{9}"
            maxlength="10"
            title="Enter a valid 10-digit mobile number."
            required>

    <!-- Event Type -->

    <select
            th:field="*{eventType}"
            required>

        <option value="">-- Select Event Type --</option>

        <option value="Wedding">Wedding</option>

        <option value="Birthday">Birthday</option>

        <option value="Baby Shoot">Baby Shoot</option>

        <option value="Pre Wedding">Pre Wedding</option>

        <option value="Corporate Event">Corporate Event</option>

    </select>

    <!-- Event Date -->

    <input
            type="date"
            th:field="*{eventDate}"
            required>

    <!-- Event Location -->

    <input
            type="text"
            placeholder="Event Location"
            th:field="*{eventLocation}"
            pattern="[A-Za-z0-9 ,.-]{3,100}"
            title="Enter a valid event location."
            required>

    <!-- Message -->

    <textarea
            placeholder="Message (Optional)"
            th:field="*{message}"
            rows="5"
            maxlength="500"></textarea>

    <!-- Submit Button -->

    <button type="submit">

        Book Event

    </button>

</form>

</div>

<script th:src="@{/js/script.js}"></script>

</body>

</html>
